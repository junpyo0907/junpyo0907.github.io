<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner - 몰입을 위한 시간 관리</title>
    <!-- 구글 폰트: 모던한 느낌의 Outfit 폰트 사용 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 머티리얼 아이콘 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- 헤더 영역 -->
        <header>
            <div class="header-top">
                <h1>My Study Space</h1>
                <button id="theme-toggle" class="icon-btn" aria-label="테마 변경">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
            <!-- 달성률 프로그레스 바 -->
            <div class="progress-container">
                <div class="progress-info">
                    <span>오늘의 달성률</span>
                    <span id="progress-percent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar-fill" class="progress-bar-fill"></div>
                </div>
            </div>
        </header>

        <main>
            <!-- 위쪽 위젯: 타이머 & 룰렛 -->
            <div class="top-widgets">
                <!-- 타이머 섹션 -->
                <section class="widget timer-widget glass-panel">
                    <div class="widget-header">
                        <h2>Timer</h2>
                        <div class="timer-tabs">
                            <button class="timer-tab active" data-type="pomodoro">뽀모도로</button>
                            <button class="timer-tab" data-type="stopwatch">스톱워치</button>
                        </div>
                    </div>
                    <div class="timer-display">
                        <span id="time-display">25:00</span>
                    </div>
                    <div class="timer-controls">
                        <button id="timer-start" class="primary-btn"><span class="material-symbols-rounded">play_arrow</span>시작</button>
                        <button id="timer-reset" class="secondary-btn"><span class="material-symbols-rounded">refresh</span>초기화</button>
                    </div>
                </section>

                <!-- 룰렛 섹션 -->
                <section class="widget roulette-widget glass-panel">
                    <div class="widget-header">
                        <h2>Subject Roulette</h2>
                        <span class="subtitle">뭐부터 할까 고민될 때</span>
                    </div>
                    <div class="roulette-display" id="roulette-result">
                        <span>?</span>
                    </div>
                    <button id="roulette-btn" class="primary-btn full-width"><span class="material-symbols-rounded">casino</span>과목 뽑기</button>
                </section>
            </div>

            <!-- 과목 선택 버튼 섹션 -->
            <section class="subject-selection">
                <h2>새로운 계획 추가</h2>
                <div class="subject-buttons">
                    <button class="subject-btn korean" data-subject="korean">
                        <span class="material-symbols-rounded">menu_book</span> 국어
                    </button>
                    <button class="subject-btn english" data-subject="english">
                        <span class="material-symbols-rounded">language</span> 영어
                    </button>
                    <button class="subject-btn math" data-subject="math">
                        <span class="material-symbols-rounded">calculate</span> 수학
                    </button>
                    <button class="subject-btn others" data-subject="others">
                        <span class="material-symbols-rounded">category</span> 기타
                    </button>
                </div>
            </section>

            <!-- 할 일 목록 섹션 -->
            <section class="todo-list-section glass-panel">
                <div class="todo-header">
                    <h2>오늘의 할 일</h2>
                </div>
                <ul id="todo-list" class="todo-list">
                    <!-- 할 일이 여기에 동적으로 추가됩니다. -->
                    <div class="empty-state">아직 추가된 계획이 없습니다. 상단의 과목 버튼을 눌러 계획을 추가해보세요!</div>
                </ul>
            </section>
        </main>
    </div>

    <!-- 세부 계획 추가 모달 -->
    <div id="plan-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <h3 id="modal-title">계획 추가</h3>
                <button id="close-modal" class="icon-btn"><span class="material-symbols-rounded">close</span></button>
            </div>
            <form id="plan-form">
                <input type="hidden" id="plan-subject" value="">
                <div class="form-group">
                    <label for="plan-name">교재명 / 강의명</label>
                    <input type="text" id="plan-name" required placeholder="예: 수능특강 문학, 시발점 수학(상)">
                </div>
                <div class="form-group">
                    <label for="plan-unit">단원 / 범위</label>
                    <input type="text" id="plan-unit" required placeholder="예: 3단원, p.15~20">
                </div>
                <div class="form-group">
                    <label for="plan-detail">세부 목표</label>
                    <textarea id="plan-detail" rows="2" placeholder="예: 개념 정리하고 예제 풀기"></textarea>
                </div>
                <button type="submit" class="primary-btn full-width submit-btn">목록에 추가하기</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
